<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Registrasi Seminar Teknologi</title>
  <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <div id="main_wrapper">
        <div class="nav_bar">
            <span>BERANDA</span>
            <span>TENTANG</span>
            <span>SEMINAR</span>
            <span>GALERI</span>
            <span>KONTAK</span>
        </div>

        <div id="form_container">
            <div class="header_box">
                ✨ REGISTRASI PESERTA SEMINAR JOVAN ✨
            </div>
            
            <form action="" method="post" enctype="multipart/form-data">
                <table class="main_table">
                    <!-- Bagian Data Peserta -->
                    <tr>
                        <td colspan="2" class="section_header">Informasi Identitas Peserta</td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <table class="nested_table">
                                <tr>
                                    <td style="width:32%;">
                                        <label for="namalengkap"><strong>Nama Lengkap Peserta</strong></label>
                                    </td>
                                    <td>
                                        <input type="text" id="namalengkap" name="namalengkap" size="30" placeholder="Masukkan nama lengkap" />
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <label for="nim"><strong>Nomor Induk Mahasiswa (NIM)</strong></label>
                                    </td>
                                    <td>
                                        <input type="text" id="nim" name="nim" size="30" placeholder="Contoh: 2507xxxxx" />
                                    </td>
                                </tr>
                                <!-- Nomor WhatsApp untuk koordinasi -->
                                <tr>
                                    <td>
                                        <label for="whatsapp"><strong>Nomor WhatsApp Aktif</strong></label>
                                    </td>
                                    <td>
                                        <input type="text" id="whatsapp" name="whatsapp" size="30" placeholder="08xxxxxxxxxx" />
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <strong>Identitas Gender</strong>
                                    </td>
                                    <td>
                                        <input type="radio" id="laki" name="jk" value="Laki-Laki" />
                                        <label for="laki">Laki-Laki</label>
                                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                                        <label for="perempuan">Perempuan</label>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <label for="prodi"><strong>Program Studi / Jurusan</strong></label>
                                    </td>
                                    <td>
                                        <select id="prodi" name="prodi">
                                            <option>Informatika</option>
                                            <option>Sistem Informasi</option>
                                            <option>Teknik Industri</option>
                                        </select>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Bagian Pilihan Seminar -->
                    <tr>
                        <td colspan="2" class="section_header">Pemilihan Kategori Seminar</td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <table class="nested_table">
                                <tr>
                                    <td style="width:32%;">
                                        <strong>Pilihan Jenis Tiket</strong>
                                    </td>
                                    <td>
                                        <input type="radio" id="reguler" name="tiket" value="Reguler" />
                                        <label for="reguler">Reguler (Sertifikat &amp; Materi)</label>
                                        <input type="radio" id="vip" name="tiket" value="VIP" />
                                        <label for="vip">VIP (Full Access + Goodie Bag)</label>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="vertical-align: middle;">
                                        <strong>Topik Sesi Utama (Pilih)</strong>
                                    </td>
                                    <td>
                                        <p class="checkbox_group">
                                            <input type="checkbox" id="topik1" name="topik" value="Web Development" />
                                            <label for="topik1">Web Development &amp; Modern Frameworks</label>
                                        </p>
                                        <p class="checkbox_group">
                                            <input type="checkbox" id="topik2" name="topik" value="Data Science" />
                                            <label for="topik2">Data Science &amp; Big Data Analytics</label>
                                        </p>
                                        <p class="checkbox_group">
                                            <input type="checkbox" id="topik3" name="topik" value="Artificial Intelligence" />
                                            <label for="topik3">Artificial Intelligence &amp; Machine Learning</label>
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Bagian Informasi Tambahan -->
                    <tr>
                        <td colspan="2" class="section_header">Catatan &amp; Dokumen Pendukung</td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <table class="nested_table">
                                <tr>
                                    <td style="width:32%; vertical-align: middle;">
                                        <label for="alasan"><strong>Motivasi Mengikuti Seminar Ini</strong></label>
                                    </td>
                                    <td>
                                        <textarea id="alasan" name="alasan" rows="6" cols="30" placeholder="Tuliskan alasan singkat Anda..."></textarea>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <label for="bukti"><strong>Unggah Bukti Transaksi</strong></label>
                                    </td>
                                    <td>
                                        <input type="file" id="bukti" name="bukti" />
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Tombol Simpan -->
                    <tr>
                        <td colspan="2" style="text-align: center; padding-top: 20px;">
                            <div class="link_button">
                                <input type="submit" name="simpan" value="Kirim Berkas Pendaftaran" class="btn_simpan" />
                            </div>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
</html>
