<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Formulir Pendaftaran Organisasi</title>
  <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
  
  <div id="form_container">
    <form action="#" method="post">
      <!-- TABEL UTAMA -->
      <table class="main_table">
        
        <!-- BARIS JUDUL (Tabel di dalam Tabel) -->
        <tr>
          <td colspan="2">
            <table class="header_table">
              <tr>
                <td>
                  <h1>Formulir Registrasi Anggota Organisasi</h1>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- BARIS 1: NAMA LENGKAP -->
        <tr>
          <td colspan="2">
            <table class="item_table">
              <tr>
                <td class="label_cell">
                  <label for="namalengkap"><strong>Nama Lengkap</strong></label>
                </td>
                <td class="input_cell">
                  <input type="text" id="namalengkap" name="namalengkap" size="30" />
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- BARIS 2: NIM / NOMOR INDUK -->
        <tr>
          <td colspan="2">
            <table class="item_table">
              <tr>
                <td class="label_cell">
                  <label for="nim"><strong>NIM / Nomor Induk</strong></label>
                </td>
                <td class="input_cell">
                  <input type="text" id="nim" name="nim" size="30" />
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- BARIS 3: ASAL SEKOLAH / INSTITUSI -->
        <tr>
          <td colspan="2">
            <table class="item_table">
              <tr>
                <td class="label_cell">
                  <label for="namasmu"><strong>Asal Sekolah / Institusi</strong></label>
                </td>
                <td class="input_cell">
                  <input type="text" id="namasmu" name="namasmu" size="30" />
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- BARIS 4: NOMOR WHATSAPP -->
        <tr>
          <td colspan="2">
            <table class="item_table">
              <tr>
                <td class="label_cell">
                  <label for="whatsapp"><strong>Nomor WhatsApp</strong></label>
                </td>
                <td class="input_cell">
                  <input type="text" id="whatsapp" name="whatsapp" size="30" />
                </td>
              </tr>
            </table>
          </td>
        </tr>
        
        <!-- BARIS 5: MINAT DAN KEGEMARAN -->
        <tr>
          <td colspan="2">
            <table class="item_table">
              <tr>
                <td class="label_cell" style="vertical-align: top;">
                  <strong>Minat dan Kegemaran</strong>
                </td>
                <td class="input_cell">
                  <p>
                    <strong>Musik Pilihan (Pilih Salah Satu)</strong><br />
                    <input type="radio" id="musik1" name="musik" value="Pop" />
                    <label for="musik1">Pop</label>
                    <input type="radio" id="musik2" name="musik" value="Rock" />
                    <label for="musik2">Rock</label>
                    <input type="radio" id="musik3" name="musik" value="Jazz" />
                    <label for="musik3">Jazz</label>
                  </p>
                  <p>
                    <strong>Film Pilihan (Pilih Salah Satu)</strong><br />
                    <input type="radio" id="film1" name="film" value="Drama" />
                    <label for="film1">Drama</label>
                    <input type="radio" id="film2" name="film" value="Action" />
                    <label for="film2">Action</label>
                    <input type="radio" id="film3" name="film" value="Sci-Fi" />
                    <label for="film3">Sci-Fi</label>
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- BARIS 6: RINGKASAN DIRI -->
        <tr>
          <td colspan="2">
            <table class="item_table">
              <tr>
                <td class="label_cell" style="vertical-align: top;">
                  <label for="resume">
                    <strong>Ringkasan Diri (Resume)</strong>
                  </label>
                </td>
                <td class="input_cell">
                  <textarea id="resume" name="resume" rows="7" cols="32"></textarea>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- BARIS TOMBOL SUBMIT -->
        <tr>
          <td colspan="2" style="text-align:center;">
            <div class="link_button">
              <input type="submit" name="simpan" value="Simpan Data" class="btn_simpan" />
            </div>
          </td>
        </tr>

      </table>
    </form>
  </div>

</body>
</html>
